<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0F4C97">
<title>Profil Akun · ITBELI</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/percakapan.css">
<style>
  .profil { display: flex; gap: var(--sp-6); align-items: center; flex-wrap: wrap; }
  .profil__avatar { width: 96px; height: 96px; border-radius: var(--radius-full); flex: none;
    background: var(--primer-200); color: var(--primer-900);
    display: grid; place-items: center; font: 700 32px/1 var(--font-sans); }
  .profil__stat { display: flex; gap: var(--sp-8); }
  .profil__stat div span { display: block; }
  .menu { display: flex; flex-direction: column; gap: 2px; }
  .menu a { display: flex; align-items: center; padding: var(--sp-3) var(--sp-3);
    border-radius: var(--radius-md); color: var(--text-900); text-decoration: none; font: 600 15px/20px var(--font-sans); }
  .menu a:hover { background: var(--hover); }
  .menu a.keluar { color: var(--danger); }
  a.card { color: inherit; text-decoration: none; }
  a.card:hover .card__media { filter: brightness(.94); }
  .kosong { padding: var(--sp-8); text-align: center; color: var(--text-600); }

  @media (max-width: 959px) {
    .profil__stat { margin-left: 0; }
  }
</style>
<script src="/js/api.js" defer></script>
<script src="/js/Kerangka.js" defer></script>
<script src="/js/HalamanOtentikasi.js" defer></script>
<script src="/js/HalamanProfil.js" defer></script>
<script src="/js/PanelNotifikasi.js" defer></script>
</head>
<body data-halaman="profil">
<div class="page">
  <header class="topbar" data-topbar></header>

  <div class="shell">
    <aside class="rail" data-judul="Profil Akun"></aside>

    <main class="content">
      <div class="content__inner col gap-6">

        <div id="pesan-galat" class="infobox infobox--galat" role="alert" hidden></div>

        <div id="profil" class="col gap-6" hidden>

          <!-- I09-O01 -->
          <div class="panel">
            <div class="profil">
              <div id="inisial" class="profil__avatar" aria-hidden="true"></div>
              <div class="col gap-1">
                <h2 id="nama-akun" class="h-page"></h2>
                <div id="identitas-akun" class="muted"></div>
                <div class="row gap-2 mt-2">
                  <span id="status-akun" class="badge"></span>
                  <span id="badge-admin" class="badge badge--tinjau" hidden>Admin</span>
                  <!-- I09-O06 -->
                  <span id="badge-diblokir" class="badge badge--bahaya" hidden>Akun diblokir</span>
                </div>
              </div>
              <div class="profil__stat ml-auto">
                <div>
                  <span id="jumlah-tersedia" class="t-price-lg">0</span>
                  <span class="t-caption muted">Listing tersedia</span>
                </div>
                <div>
                  <span id="jumlah-terjual" class="t-price-lg">0</span>
                  <span class="t-caption muted">Barang terjual</span>
                </div>
              </div>
            </div>
          </div>

          <div class="dua">

            <!-- I09-O02 -->
            <section class="col gap-4">
              <div class="row">
                <h3 class="h-sec">Listing saya</h3>
                <a class="btn btn--teks btn--sm ml-auto" href="/listing-saya">Lihat semua</a>
              </div>
              <div id="daftar-listing" class="grid grid--3"></div>
              <div id="listing-kosong" class="panel kosong" hidden>
                Anda belum memiliki listing.
                <div class="mt-4"><a class="btn btn--primer btn--sm" href="/listing-form">+ Jual Barang</a></div>
              </div>
            </section>

            <!-- I09-O03 -->
            <aside class="panel col gap-3">
              <h3 class="rail__title">Pengaturan akun</h3>
              <nav class="menu">
                <!-- I09-O04 -->
                <a id="tautan-kebijakan" href="/legal?jenis=kebijakan-privasi">Kebijakan Privasi</a>
                <a href="/legal?jenis=ketentuan-penggunaan">Ketentuan Penggunaan</a>
                <div class="divider mt-2"></div>
                <!-- I09-O05 -->
                <a id="tombol-keluar" href="/masuk" class="keluar mt-2">Keluar</a>
              </nav>
            </aside>

          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
