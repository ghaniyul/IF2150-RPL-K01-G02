<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0F4C97">
<title>Dokumen Legal · ITBELI</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  .legal { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: var(--sp-6);
    max-width: 1100px; margin: 0 auto; padding: var(--sp-6) var(--sp-4); }
  .toc { position: sticky; top: calc(var(--topbar-h) + var(--sp-4)); align-self: start;
    background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
    padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }
  .toc nav { display: flex; flex-direction: column; gap: 2px; }
  .toc a { font: 600 14px/20px var(--font-sans); color: var(--text-900); text-decoration: none;
    padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md); }
  .toc a:hover { background: var(--hover); }
  .toc a.is-active { color: var(--primer-700); background: var(--primer-50); }
  .doc { background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
    padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); min-width: 0; }
  #dokumen { display: flex; flex-direction: column; gap: var(--sp-5); }
  #dokumen section { display: flex; flex-direction: column; scroll-margin-top: calc(var(--topbar-h) + var(--sp-4)); }
  #dokumen section + section { margin-top: var(--sp-5); }
  #dokumen h3 { font: 700 17px/24px var(--font-sans); }
  #dokumen p { font-size: 15px; line-height: 24px; color: var(--text-600); }

  @media (max-width: 959px) {
    .legal { grid-template-columns: minmax(0, 1fr); }
    .toc { position: static; }
  }
  @media (max-width: 600px) {
    .toc { display: none; }
    .doc { padding: var(--sp-4); }
  }
</style>
<script src="/js/api.js" defer></script>
<script src="/js/HalamanDokumenLegal.js" defer></script>
</head>
<body>
<div class="page">
  <header class="topbar topbar--sederhana">
    <div class="topbar__left">
      <a class="brand" href="/" aria-label="ITBELI, beranda">
        <img class="brand__mark" src="/ikon/itbeli-simbol.svg" alt="" width="40" height="40">
        <img class="brand__name" src="/ikon/itbeli-nama.svg" alt="ITBELI" width="60" height="20">
      </a>
    </div>
    <div class="topbar__right">
      <a class="btn btn--sekunder" href="/masuk" data-tamu>Masuk</a>
      <a class="btn btn--primer" href="/daftar" data-tamu>Daftar</a>
      <a class="btn btn--sekunder" href="/" data-pengguna hidden>Beranda</a>
    </div>
  </header>

  <main class="legal">

    <!-- I15-O05 -->
    <aside class="toc">
      <h2 class="rail__title">Daftar isi</h2>
      <nav id="daftar-isi" aria-label="Daftar isi dokumen"></nav>
    </aside>

    <article class="doc">

      <!-- I15-O01 -->
      <div class="tabs" role="tablist">
        <a href="/legal?jenis=kebijakan-privasi" data-jenis="kebijakan-privasi" role="tab">Kebijakan Privasi</a>
        <a href="/legal?jenis=ketentuan-penggunaan" data-jenis="ketentuan-penggunaan" role="tab">Ketentuan Penggunaan</a>
      </div>

      <div id="pesan-galat" class="infobox infobox--galat" role="alert" hidden></div>

      <div id="dokumen" hidden>
        <!-- I15-O02 -->
        <div>
          <h1 id="judul-dokumen" class="h-page"></h1>
          <p id="info-versi" class="muted mt-2 t-caption"></p>
        </div>

        <!-- I15-O04 -->
        <div id="klausa-privasi" class="infobox" hidden></div>

        <!-- I15-O03 -->
        <div id="isi-dokumen"></div>
      </div>

    </article>
  </main>
</div>
</body>
</html>
