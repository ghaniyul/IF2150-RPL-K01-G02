<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0F4C97">
  <title>Detail Barang · ITBELI</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/katalog.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/Kerangka.js" defer></script>
  <script src="/js/ListingUI.js" defer></script>
  <script src="/js/layoutKatalog.js" defer></script>
  <script src="/js/HalamanDetailBarang.js" defer></script>
  <script src="/js/PanelNotifikasi.js" defer></script>
</head>
<body>
<div class="page">
  <header id="listing-topbar" class="topbar" data-topbar></header>
  <main>
    <div class="detail-pesan">
      <div id="galat-umum" class="infobox infobox--galat" role="alert" hidden></div>
      <p id="memuat" class="muted">Memuat detail listing…</p>
    </div>

    <div id="detail" class="detail-barang" hidden>
      <section class="detail-barang__galeri" aria-label="Foto barang">
        <a href="/katalog" class="iconbtn detail-kembali" aria-label="Kembali ke katalog" title="Kembali ke katalog"><span class="ic ic--chevL"></span></a>
        <button type="button" id="foto-sebelum" class="iconbtn detail-barang__nav detail-barang__nav--kiri" aria-label="Foto sebelumnya" hidden><span class="ic ic--chevL"></span></button>
        <div id="foto-utama" class="detail-barang__foto"></div>
        <button type="button" id="foto-berikut" class="iconbtn detail-barang__nav detail-barang__nav--kanan" aria-label="Foto berikutnya" hidden><span class="ic ic--chevR"></span></button>
        <div id="foto-thumbs" class="detail-barang__thumbs"></div>
      </section>

      <aside class="detail-barang__info" aria-label="Rincian barang">
        <span id="badge-status" class="badge badge--terjual" hidden>Terjual</span>
        <h1 id="judul" class="detail-barang__judul"></h1>
        <div id="harga" class="detail-barang__harga"></div>
        <p class="detail-barang__unggah">Diunggah <span id="waktu"></span> di <span id="lokasi"></span></p>

        <div id="aksi" class="detail-barang__aksi"></div>

        <div class="divider"></div>

        <section class="detail-barang__bagian">
          <h2>Rincian</h2>
          <dl class="detail-barang__meta">
            <dt>Ketersediaan</dt><dd id="status-teks"></dd>
            <dt>Kategori</dt><dd id="kategori"></dd>
          </dl>
          <p id="deskripsi" class="detail-barang__deskripsi"></p>
        </section>

        <div class="divider"></div>

        <section class="detail-barang__bagian">
          <h2>Informasi penjual</h2>
          <div class="detail-barang__penjual">
            <div id="penjual-inisial" class="avatar" aria-hidden="true"></div>
            <div id="penjual-nama" class="detail-barang__nama"></div>
          </div>
        </section>

        <form id="kotak-pesan" class="kotak-pesan" novalidate hidden>
          <label for="pesan-awal" class="field__label">Kirim pesan ke penjual</label>
          <textarea id="pesan-awal" class="field__area" maxlength="2000">Apakah barang ini masih tersedia?</textarea>
          <button id="kirim-pesan-awal" type="submit" class="btn btn--primer">Kirim</button>
        </form>
      </aside>
    </div>
  </main>
  <div id="pesan" class="toast" role="status" hidden></div>
</div>
</body>
</html>
